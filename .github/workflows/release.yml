# A full release, started by hand (Actions › Release › Run workflow). It checks main, raises the
# version, tags it, builds and signs the desktop app for Windows, macOS and Linux, publishes the
# release with the updater's latest.json (installed apps update to it), and deploys the website to
# GitHub Pages. The website is only ever deployed from a release.
#
# The raised version reaches main only once every build has passed: until then it lives on the
# release's tag alone. If a build fails (or the run is cancelled), the draft release and its tag are
# taken away again, so main keeps its version and the next run makes the same one. Should bringing
# main up to the release fail (main changed the version lines meanwhile), fix main and use
# "Re-run failed jobs": the builds are kept.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if
# the key has one): the private half of the key whose public half is in src-tauri/tauri.conf.json.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: Or an exact version (e.g. 1.0.0); overrides the bump
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Version, tag and draft
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          current=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "${current%%-*}"
          if [ -n "$EXACT" ]; then version="${EXACT#v}"
          elif [ "$BUMP" = major ]; then version="$((major + 1)).0.0"
          elif [ "$BUMP" = minor ]; then version="${major}.$((minor + 1)).0"
          else version="${major}.${minor}.$((patch + 1))"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::$version is not a release version (x.y.z)"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then echo "::error::v$version exists already"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The version commit goes to the tag only; main gets it once the builds have passed (publish).
      - name: Commit the version and tag it
        run: |
          node scripts/set-version.mjs "${{ steps.v.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.v.outputs.version }} [skip ci]"
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"
      - id: draft
        name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" --draft --verify-tag --generate-notes --title "Soundwave ${{ steps.v.outputs.version }}"
          echo "id=$(gh release view "v${{ steps.v.outputs.version }}" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: ./.github/actions/setup-build
        with:
          os: ${{ matrix.os }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Discord application the profile status belongs to (src-tauri/src/discord.rs); unset = no status.
          SOUNDWAVE_DISCORD_CLIENT_ID: ${{ vars.SOUNDWAVE_DISCORD_CLIENT_ID }}
        with:
          tauriScript: pnpm tauri
          # Release builds also make the signed update bundles the installed apps download.
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: Publish the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      # Every build passed: main takes the version. Straight onto the tag when main has not moved
      # since; otherwise the tag's version commit is merged in.
      - name: Bring main up to the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          git merge --ff-only "v$VERSION" || git merge --no-ff --no-edit -m "chore(release): v$VERSION into main [skip ci]" "v$VERSION"
          git push origin HEAD:main
      - run: gh release edit "v$VERSION" --draft=false --latest

  cleanup:
    name: Take back a release whose build failed
    needs: [prepare, build]
    # Only after the tag and draft were made, and whenever the builds did not all pass: failed,
    # stopped, or cancelled by GitHub (a build waiting for a macOS runner that never comes is
    # cancelled, which neither failure() nor cancelled() notices on its own).
    if: always() && needs.prepare.result == 'success' && needs.build.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "v${{ needs.prepare.outputs.version }}" --yes --cleanup-tag

  website:
    name: Deploy the website
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v6
        id: pages
      - run: pnpm build
        env:
          # The site lives under /<repository>/ on github.io.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      # Named after the attempt: "Re-run failed jobs" uploads the site again, and the deploy refuses
      # a run that holds two artifacts of the same name.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      # The deploy can ask for the artifact before GitHub lists it ("No artifacts named ... were
      # found"): it tries once more after a moment.
      - uses: actions/deploy-pages@v5
        id: deploy
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v5
        id: deploy-again
        if: steps.deploy.outcome == 'failure'
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
