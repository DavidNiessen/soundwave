# A Soundwave server, for Docker Compose or Coolify (a "Docker Compose" resource pointing at this
# repository; Coolify reads this file). Everything the server keeps (accounts, scores, shared
# songs, the party song cache, its signing secret) is in the named volume `soundwave-data`, so it
# stays across redeploys and updates. Settings: server/README.md.
services:
  soundwave:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      # Coolify fills SERVICE_FQDN_SOUNDWAVE_7420 with the domain it gives the service (and routes
      # it to port 7420); the address goes into invite links. Elsewhere, set SOUNDWAVE_PUBLIC_URL.
      - SERVICE_FQDN_SOUNDWAVE_7420
      - SOUNDWAVE_PUBLIC_URL=${SERVICE_FQDN_SOUNDWAVE:-${SOUNDWAVE_PUBLIC_URL:-}}
      - SOUNDWAVE_NAME=${SOUNDWAVE_NAME:-Soundwave server}
      - SOUNDWAVE_DESCRIPTION=${SOUNDWAVE_DESCRIPTION:-}
      # public, password or invite (the default: an invite link lets each friend in).
      - SOUNDWAVE_MODE=${SOUNDWAVE_MODE:-invite}
      - SOUNDWAVE_PASSWORD=${SOUNDWAVE_PASSWORD:-}
      # The web game players sign in from and invite links offer (a copy of your own, if you host one).
      - SOUNDWAVE_WEB_GAME=${SOUNDWAVE_WEB_GAME:-https://soundwave.niessen.dev}
      # Take players' addresses (for the rate limits) from the proxy in front: right here, where
      # the port is only exposed to Coolify's proxy (or published to 127.0.0.1 for a proxy on the
      # same machine). Published to the internet with no proxy in front, set it to false: anyone
      # could then send the header and pick the address they are counted by.
      - SOUNDWAVE_TRUST_PROXY=${SOUNDWAVE_TRUST_PROXY:-true}
      - SOUNDWAVE_SONG_SHARING=${SOUNDWAVE_SONG_SHARING:-off}
      - SOUNDWAVE_PARTY_SONGS=${SOUNDWAVE_PARTY_SONGS:-true}
      - SOUNDWAVE_PARTY_CACHE_MB=${SOUNDWAVE_PARTY_CACHE_MB:-4000}
    volumes:
      - soundwave-data:/data
    # Reached through Coolify's proxy; without Coolify, publish it to the proxy on this machine
    # instead: ports: ["127.0.0.1:7420:7420"] (docs/server-setup.md, 2B).
    expose:
      - '7420'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:7420/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  soundwave-data:
