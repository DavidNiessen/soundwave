<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="157" height="28" viewBox="0 0 157 28" fill="none" role="img" aria-label="release: passing">
<title>release: passing</title>
<style>
svg{color-scheme:dark}
text{font-family:rs-inter, 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;}
.h{font-family:rs-space-grotesk, 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif}
.t{fill:#f7f7f8}.m{fill:#8f8994}.a{fill:#8b4fc8}.g{fill:#a571d9}.s{fill:#423e46}.a2{fill:#c775ba}
.b{font-weight:700}
.fx{transform-box:fill-box;transform-origin:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
