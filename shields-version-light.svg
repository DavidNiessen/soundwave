<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="138" height="28" viewBox="0 0 138 28" fill="none" role="img" aria-label="version: v2.0.0">
<title>version: v2.0.0</title>
<style>
svg{color-scheme:light}
text{font-family:rs-inter, 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;}
.h{font-family:rs-space-grotesk, 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif}
.t{fill:#19181b}.m{fill:#736d79}.a{fill:#8b4fc8}.g{fill:#7236ae}.s{fill:#d4d2d5}.a2{fill:#983e89}
.b{font-weight:700}
.fx{transform-box:fill-box;transform-origin:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes roll{to{transform:translateY(var(--y))}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
.in{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadeIn .8s ease both}
.blink{animation:blink 1s step-end infinite}

@media (prefers-reduced-motion: reduce){
  *{animation-delay:0s!important;animation-duration:1ms!important;animation-iteration-count:1!important}
  .loop{animation:none!important}.loop-only{display:none}
}text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif}
.sh{animation:shimmer 6s ease-in-out infinite}
.spin{transform-box:view-box;transform-origin:94.0px 14px;animation:spin 1.1s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.vseg{transform-box:fill-box;transform-origin:left;animation:growX .6s cubic-bezier(.2,.7,.2,1) 0.10s both}</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d4d2d5" opacity="0.8"/></pattern>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#d4d2d5" stroke-width=".6" opacity="0.7"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V10" stroke="#d4d2d5" stroke-width=".8" opacity="0.5"/></pattern>
<linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b4fc8"/><stop offset="1" stop-color="#7236ae"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fafafb" stop-opacity="0"/><stop offset="1" stop-color="#fafafb"/></linearGradient></defs>
<g class="fade" style="animation-delay:0.00s"><clipPath id="bc"><rect width="138" height="28" rx="14"/></clipPath><g clip-path="url(#bc)"><rect width="138" height="28" fill="#e7e6e7"/><rect x="80.0" width="58.0" height="28" fill="#8b4fc8" class="vseg"/><rect width="138" height="14" fill="#fff" opacity="0.12"/><rect class="sh loop loop-only" x="-60" width="48" height="28" fill="url(#shine)" transform="skewX(-20)" style="animation-delay:2.00s"/></g><rect x=".5" y=".5" width="137" height="27" rx="13.5" stroke="#e5e5e6" stroke-opacity="1"/><svg x="10" y="7" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#8b4fc8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2.5h5.5l6.5 6.5-5 5L2.5 7.5zM5 5h.01"/></svg><text x="30.0" y="18.1" font-size="11.5" fill="#736d79" textLength="40.0" lengthAdjust="spacingAndGlyphs">version</text><g class="fade" style="animation-delay:0.25s"><text x="90.0" y="18.1" font-size="11.5" fill="#ffffff" font-weight="700" textLength="37.3" lengthAdjust="spacingAndGlyphs">v2.0.0</text></g></g>
</svg>
