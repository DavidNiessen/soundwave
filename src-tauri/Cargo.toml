[package]
name = "soundwave"
version = "1.4.0"
description = "Rhythm game that charts your own songs"
authors = []
license = "Apache-2.0"
repository = "https://github.com/DavidNiessen/soundwave"
edition = "2024"
rust-version = "1.92"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "soundwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
cpal = "0.16"
# Shared on macOS: by default hidapi seizes a device there, and the web view would stop
# seeing the controller it reads the touchpad and sets the light bar of.
hidapi = { version = "2", features = ["macos-shared-device"] }
discord-rich-presence = "1.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# The analysis models, run by the app itself where ONNX Runtime publishes a build (models.rs):
# Apple silicon with Core ML, and Linux. Its prebuilt library is fetched when the app is built.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-31", "coreml"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-31"] }

# The Windows webview's own settings (browser shortcuts off in release builds: see lib.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
